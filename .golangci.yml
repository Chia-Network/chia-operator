version: "2"
run:
  allow-parallel-runners: true
linters:
  enable:
    - copyloopvar
    - dupl
    - ginkgolinter
    - goconst
    - gocyclo
    - lll
    - misspell
    - nakedret
    - prealloc
    - unconvert
    - unparam
  settings:
    goconst:
      # Keep literal expected values and fixtures readable in tests.
      ignore-tests: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # ChiaNode Reconcile function complexity has become too high
      - linters:
          - gocyclo
        path: internal/controller/chianode/controller.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
